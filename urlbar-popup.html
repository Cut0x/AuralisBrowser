<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Auralis URL Suggestions</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1020;
      --border: rgba(255,255,255,.14);
      --text: #d8dbef;
      --muted: #9aa0bb;
      --hover: rgba(255,255,255,.08);
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    #root {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
      overflow-y: auto;
      padding: 4px;
    }
    .item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 7px;
      padding: 8px 10px;
      display: grid;
      gap: 2px;
      cursor: pointer;
    }
    .item:hover, .item.active { background: var(--hover); }
    .title {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .url {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="root" role="listbox" aria-label="Suggestions URL"></div>
  <script type="module" src="/src/urlbar-popup.ts"></script>
</body>
</html>
