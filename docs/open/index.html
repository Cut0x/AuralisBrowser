<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Auralis — Démo Web</title>
  <meta name="description" content="Essayez Auralis directement dans votre navigateur."/>
  <link rel="icon" type="image/svg+xml" href="../../public/auralis.svg"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
/* ═══════════════════════════════════════════════════════════════
   Auralis Browser — Web Demo
   Full browser chrome, no Tauri required.
   ═══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #07050f;
  --bg-1:         #0c0a1a;
  --bg-2:         #110e22;
  --glass:        rgba(255,255,255,.06);
  --glass-h:      rgba(255,255,255,.1);
  --glass-2:      rgba(255,255,255,.04);
  --border:       rgba(255,255,255,.1);
  --border-h:     rgba(255,255,255,.18);
  --rose:         #e8587a;
  --rose-glow:    rgba(232,88,122,.35);
  --violet:       #9b6fe0;
  --violet-glow:  rgba(155,111,224,.3);
  --text:         rgba(255,255,255,.92);
  --text-2:       rgba(255,255,255,.55);
  --text-3:       rgba(255,255,255,.28);
  --accent:       #e8587a;
  --accent-violet:#9b6fe0;
  --r-sm:   6px;
  --r-md:   10px;
  --r-lg:   16px;
  --ease:   cubic-bezier(.4,0,.2,1);
  --t:      180ms;

  /* theme-able */
  --topbar-bg:    rgba(7,5,15,.88);
  --topbar-blur:  16px;
  --tab-bg:       rgba(255,255,255,.05);
  --tab-active:   rgba(155,111,224,.18);
  --tab-border:   rgba(155,111,224,.4);
  --fav-bg:       rgba(7,5,15,.8);
  --url-bg:       rgba(255,255,255,.06);
  --url-bg-focus: rgba(255,255,255,.1);
  --content-bg:   #07050f;
}

[data-theme="light"] {
  --bg: #f0eef8; --bg-1: #e8e4f5; --bg-2: #ddd8f0;
  --glass: rgba(0,0,0,.05); --glass-h: rgba(0,0,0,.09);
  --glass-2: rgba(0,0,0,.03);
  --border: rgba(0,0,0,.12); --border-h: rgba(0,0,0,.2);
  --text: rgba(0,0,0,.87); --text-2: rgba(0,0,0,.55); --text-3: rgba(0,0,0,.3);
  --topbar-bg: rgba(240,238,248,.9);
  --tab-bg: rgba(0,0,0,.05); --tab-active: rgba(155,111,224,.15);
  --fav-bg: rgba(240,238,248,.85);
  --url-bg: rgba(0,0,0,.06); --url-bg-focus: rgba(0,0,0,.1);
  --content-bg: #f0eef8;
}

[data-theme="midnight"] {
  --bg: #000; --bg-1: #050508; --bg-2: #08070f;
  --glass: rgba(255,255,255,.04); --glass-h: rgba(255,255,255,.08);
  --topbar-bg: rgba(0,0,0,.95);
  --tab-active: rgba(232,88,122,.18); --tab-border: rgba(232,88,122,.4);
  --accent: #e8587a;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }

/* ── DEMO WRAPPER ──────────────────────────────────────────────── */
.demo-notice {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
  background: linear-gradient(90deg, rgba(232,88,122,.15), rgba(155,111,224,.15));
  border-top: 1px solid rgba(155,111,224,.3);
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px; gap: 12px; font-size: 12px; color: var(--text-2);
}
.demo-notice a { color: var(--violet); text-decoration: none; font-weight: 600; }
.demo-notice a:hover { color: var(--rose); }
.demo-close { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; }
.demo-close:hover { color: var(--text); }

/* ── WINDOW FRAME ──────────────────────────────────────────────── */
.browser-window {
  display: flex; flex-direction: column;
  height: calc(100vh - 36px); /* leave room for demo notice */
  background: var(--content-bg);
  position: relative;
}

/* ── TOPBAR ────────────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: stretch; height: 40px;
  background: var(--topbar-bg);
  backdrop-filter: blur(var(--topbar-blur));
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: relative; z-index: 100;
  -webkit-app-region: drag;
}

/* ── TAB STRIP ─────────────────────────────────────────────────── */
.tab-strip {
  display: flex; align-items: flex-end;
  flex: 1; overflow-x: auto; overflow-y: hidden;
  padding: 6px 0 0 8px; gap: 2px; min-width: 0;
  scrollbar-width: none;
}
.tab-strip::-webkit-scrollbar { display: none; }

.tab {
  display: flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 10px 0 10px;
  background: var(--tab-bg); border: 1px solid transparent;
  border-bottom: none; border-radius: var(--r-sm) var(--r-sm) 0 0;
  cursor: pointer; max-width: 200px; min-width: 80px; flex-shrink: 0;
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
  -webkit-app-region: no-drag; position: relative;
}
.tab:hover { background: var(--glass-h); border-color: var(--border); }
.tab.active {
  background: var(--tab-active); border-color: var(--tab-border);
  box-shadow: 0 -2px 8px rgba(155,111,224,.15);
}
.tab-favicon { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; display: none; }
.tab-favicon.loaded { display: block; }
.tab-icon { font-size: 12px; color: var(--text-3); flex-shrink: 0; }
.tab-title { font-size: 12px; color: var(--text-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.active .tab-title { color: var(--text); }
.tab-close {
  flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%;
  background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--text-3); transition: background var(--t), color var(--t);
  -webkit-app-region: no-drag;
}
.tab-close:hover { background: rgba(232,88,122,.3); color: var(--rose); }

.btn-new-tab {
  flex-shrink: 0; width: 28px; height: 28px; margin: 0 2px 2px 2px;
  align-self: flex-end;
  background: none; border: 1px solid transparent; border-radius: var(--r-sm);
  color: var(--text-3); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--t), color var(--t), border-color var(--t);
  -webkit-app-region: no-drag;
}
.btn-new-tab:hover { background: var(--glass-h); color: var(--text); border-color: var(--border); }

/* ── WINDOW CONTROLS ───────────────────────────────────────────── */
.win-controls {
  display: flex; align-items: stretch; flex-shrink: 0;
  margin-left: auto; -webkit-app-region: no-drag;
}
.win-btn {
  width: 46px; height: 100%; background: none; border: none;
  color: var(--text-2); font-size: 13px; cursor: pointer; border-radius: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--t), color var(--t);
}
.win-btn:hover { background: var(--glass-h); color: var(--text); }
.win-close:hover { background: #e81123 !important; color: #fff !important; }

/* ── NAVBAR ────────────────────────────────────────────────────── */
.navbar {
  display: flex; align-items: center; gap: 6px;
  height: 42px; padding: 0 10px;
  background: var(--topbar-bg);
  backdrop-filter: blur(var(--topbar-blur));
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.nav-btn {
  width: 30px; height: 30px; background: none; border: none;
  border-radius: var(--r-sm); color: var(--text-2); font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background var(--t), color var(--t);
  flex-shrink: 0;
}
.nav-btn:hover:not(:disabled) { background: var(--glass-h); color: var(--text); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* URL bar */
.url-bar-wrap {
  flex: 1; display: flex; align-items: center; position: relative; min-width: 0;
}
.url-security { position: absolute; left: 10px; font-size: 12px; color: var(--text-3); pointer-events: none; z-index: 1; }
.url-security.secure { color: #4caf50; }
.url-bar {
  width: 100%; height: 30px; padding: 0 32px 0 30px;
  background: var(--url-bg); border: 1px solid var(--border); border-radius: var(--r-full);
  color: var(--text); font-size: 13px; outline: none;
  transition: background var(--t), border-color var(--t), box-shadow var(--t);
}
.url-bar:focus {
  background: var(--url-bg-focus);
  border-color: var(--violet);
  box-shadow: 0 0 0 3px var(--violet-glow);
}
.url-bar::placeholder { color: var(--text-3); }
.url-reload {
  position: absolute; right: 8px; font-size: 13px; color: var(--text-3);
  background: none; border: none; cursor: pointer; width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: color var(--t), transform var(--t);
}
.url-reload:hover { color: var(--text); }
.url-reload.loading { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FAVORITES BAR ─────────────────────────────────────────────── */
.favorites-bar {
  display: flex; align-items: center; gap: 2px;
  height: 30px; padding: 0 8px;
  background: var(--fav-bg); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow: hidden;
}
.favorites-bar.hidden { display: none; }
.fav-item {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: var(--r-full);
  background: none; border: none; cursor: pointer; color: var(--text-2);
  font-size: 12px; white-space: nowrap; max-width: 150px; overflow: hidden;
  text-overflow: ellipsis; transition: background var(--t), color var(--t);
  text-decoration: none;
}
.fav-item:hover { background: var(--glass-h); color: var(--text); }
.fav-icon { font-size: 11px; flex-shrink: 0; }

/* ── CONTENT ───────────────────────────────────────────────────── */
.content-area { flex: 1; position: relative; min-height: 0; }
.tab-frame {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: none; display: none; background: var(--content-bg);
}
.tab-frame.active { display: block; }

/* ── NEW TAB PAGE ──────────────────────────────────────────────── */
.newtab-page {
  position: absolute; inset: 0; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  background: var(--content-bg); gap: 32px; padding: 20px;
}
.newtab-page.active { display: flex; }

.newtab-logo {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.newtab-logo svg { filter: drop-shadow(0 0 20px rgba(155,111,224,.4)); }
.newtab-logo-name {
  font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--rose), var(--violet));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.newtab-time {
  font-size: 56px; font-weight: 200; letter-spacing: -2px;
  color: var(--text); line-height: 1; font-variant-numeric: tabular-nums;
}
.newtab-date { font-size: 14px; color: var(--text-2); text-align: center; }

.newtab-search {
  width: 100%; max-width: 520px; display: flex; align-items: center;
  background: var(--glass); border: 1px solid var(--border); border-radius: var(--r-full);
  padding: 0 16px; gap: 10px;
  transition: border-color var(--t), box-shadow var(--t);
}
.newtab-search:focus-within {
  border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-glow);
}
.newtab-search i { color: var(--text-3); font-size: 16px; }
.newtab-search input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-size: 16px; height: 46px;
}
.newtab-search input::placeholder { color: var(--text-3); }

.newtab-quicklinks {
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 480px;
}
.quicklink {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 16px; border-radius: var(--r-md);
  background: var(--glass); border: 1px solid var(--border);
  cursor: pointer; text-decoration: none; color: var(--text-2);
  transition: background var(--t), border-color var(--t), color var(--t), transform var(--t);
  min-width: 72px;
}
.quicklink:hover { background: var(--glass-h); border-color: var(--border-h); color: var(--text); transform: translateY(-2px); }
.quicklink i { font-size: 20px; }
.quicklink span { font-size: 11px; white-space: nowrap; }

/* ── SETTINGS PANEL ────────────────────────────────────────────── */
.settings-overlay {
  position: absolute; inset: 0; background: rgba(7,5,15,.6);
  backdrop-filter: blur(4px); z-index: 200; display: none;
  align-items: center; justify-content: center;
}
.settings-overlay.open { display: flex; }
.settings-panel {
  width: 420px; max-width: calc(100vw - 40px); max-height: calc(100vh - 120px);
  background: linear-gradient(145deg, #1a1530, #110e22);
  border: 1px solid var(--border); border-radius: var(--r-lg);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
}
.settings-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.settings-header h2 { font-size: 15px; font-weight: 600; }
.settings-close { background: none; border: none; color: var(--text-3); font-size: 18px; cursor: pointer; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: var(--r-sm); transition: background var(--t), color var(--t); }
.settings-close:hover { background: var(--glass-h); color: var(--text); }
.settings-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 20px; }
.settings-body::-webkit-scrollbar { width: 4px; }
.settings-body::-webkit-scrollbar-track { background: transparent; }
.settings-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.settings-group h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin-bottom: 10px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.settings-row:last-child { border-bottom: none; }
.settings-row label { font-size: 13px; color: var(--text-2); }

.theme-btns { display: flex; gap: 6px; }
.theme-btn {
  padding: 5px 12px; border-radius: var(--r-sm);
  background: var(--glass); border: 1px solid var(--border);
  color: var(--text-2); font-size: 12px; cursor: pointer;
  transition: background var(--t), border-color var(--t), color var(--t);
}
.theme-btn:hover { background: var(--glass-h); }
.theme-btn.active { background: rgba(155,111,224,.2); border-color: var(--violet); color: var(--text); }

.toggle { position: relative; display: inline-flex; align-items: center; cursor: pointer; gap: 8px; }
.toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.toggle-track {
  width: 34px; height: 18px; border-radius: 9px;
  background: rgba(255,255,255,.12); transition: background var(--t);
  flex-shrink: 0; position: relative;
}
.toggle input:checked + .toggle-track { background: var(--violet); }
.toggle-track::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%; background: #fff;
  transition: transform var(--t); box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.toggle input:checked + .toggle-track::after { transform: translateX(16px); }

select.settings-select {
  background: var(--glass); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text); font-size: 13px; padding: 5px 10px; outline: none; cursor: pointer;
}
select.settings-select:focus { border-color: var(--violet); }

/* ── SCROLLBAR ─────────────────────────────────────────────────── */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<div class="browser-window" id="browser">

  <!-- TOPBAR: tabs + window controls -->
  <div class="topbar">
    <div class="tab-strip" id="tab-strip">
      <!-- tabs rendered by JS -->
      <button class="btn-new-tab" id="btn-new-tab" title="Nouvel onglet"><i class="bi bi-plus"></i></button>
    </div>
    <div class="win-controls">
      <button class="win-btn" id="btn-settings" title="Paramètres"><i class="bi bi-gear"></i></button>
      <button class="win-btn" title="Réduire (démo)"><i class="bi bi-dash-lg"></i></button>
      <button class="win-btn" title="Agrandir (démo)"><i class="bi bi-square"></i></button>
      <button class="win-btn win-close" id="btn-close-demo" title="Fermer la démo"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>

  <!-- NAVBAR: navigation controls + URL bar -->
  <div class="navbar">
    <button class="nav-btn" id="btn-back"    title="Précédent" disabled><i class="bi bi-arrow-left"></i></button>
    <button class="nav-btn" id="btn-forward" title="Suivant"   disabled><i class="bi bi-arrow-right"></i></button>
    <button class="nav-btn" id="btn-reload"  title="Actualiser"><i class="bi bi-arrow-clockwise"></i></button>
    <button class="nav-btn" id="btn-home"    title="Accueil"><i class="bi bi-house"></i></button>

    <div class="url-bar-wrap">
      <span class="url-security" id="url-security"><i class="bi bi-globe2"></i></span>
      <input class="url-bar" id="url-bar" type="text" placeholder="Rechercher ou saisir une adresse..." autocomplete="off" spellcheck="false"/>
      <button class="url-reload" id="url-reload-btn"><i class="bi bi-arrow-clockwise"></i></button>
    </div>

    <button class="nav-btn" id="btn-bookmark" title="Favori"><i class="bi bi-bookmark"></i></button>
    <button class="nav-btn" id="btn-toggle-fav" title="Barre des favoris"><i class="bi bi-bookmarks"></i></button>
  </div>

  <!-- FAVORITES BAR -->
  <div class="favorites-bar hidden" id="favorites-bar">
    <!-- populated by JS -->
  </div>

  <!-- CONTENT -->
  <div class="content-area" id="content-area">
    <!-- new tab pages and iframes rendered by JS -->
  </div>

  <!-- SETTINGS OVERLAY -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel">
      <div class="settings-header">
        <h2><i class="bi bi-gear" style="color:var(--violet);margin-right:8px"></i>Paramètres</h2>
        <button class="settings-close" id="settings-close"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="settings-body">

        <div class="settings-group">
          <h3>Apparence</h3>
          <div class="settings-row">
            <label>Thème</label>
            <div class="theme-btns">
              <button class="theme-btn active" data-theme="dark">Sombre</button>
              <button class="theme-btn" data-theme="light">Clair</button>
              <button class="theme-btn" data-theme="midnight">Minuit</button>
            </div>
          </div>
          <div class="settings-row">
            <label>Barre des favoris</label>
            <label class="toggle">
              <input type="checkbox" id="toggle-favbar" checked/>
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <h3>Navigation</h3>
          <div class="settings-row">
            <label>Moteur de recherche</label>
            <select class="settings-select" id="search-engine-select">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="ecosia">Ecosia</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <h3>Langue</h3>
          <div class="settings-row">
            <label>Interface</label>
            <select class="settings-select" id="lang-select">
              <option value="fr">Français</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <h3>À propos</h3>
          <div class="settings-row">
            <label>Version</label>
            <span style="font-size:12px;color:var(--text-3)">Auralis v0.1.0 (web demo)</span>
          </div>
          <div class="settings-row">
            <label>Licence</label>
            <span style="font-size:12px;color:var(--text-3)">MIT © 2024 Auralis Contributors</span>
          </div>
          <div class="settings-row">
            <label style="color:var(--text-3);font-size:12px">Démo web — certaines fonctionnalités nécessitent l'app desktop.</label>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>

<!-- DEMO NOTICE (bottom bar) -->
<div class="demo-notice" id="demo-notice">
  <span><i class="bi bi-info-circle" style="color:var(--violet)"></i>&nbsp; Démo web — certaines pages ne s'affichent pas dans un iframe (politique CORS). <a href="../download.html">Télécharger l'app desktop</a> pour la navigation complète.</span>
  <button class="demo-close" id="demo-notice-close" title="Fermer"><i class="bi bi-x"></i></button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Auralis Web Demo — browser.js (inline)
   ═══════════════════════════════════════════════════════════════ */

/* ── SEARCH ENGINES ─────────────────────────────────────────────── */
const SEARCH_ENGINES = {
  google:     q => `https://www.google.com/search?q=${encodeURIComponent(q)}`,
  bing:       q => `https://www.bing.com/search?q=${encodeURIComponent(q)}`,
  duckduckgo: q => `https://duckduckgo.com/?q=${encodeURIComponent(q)}`,
  ecosia:     q => `https://www.ecosia.org/search?q=${encodeURIComponent(q)}`,
};

/* ── QUICK LINKS (new tab) ─────────────────────────────────────── */
const QUICK_LINKS = [
  { label: 'Google',    url: 'https://google.com',    icon: 'bi-google' },
  { label: 'YouTube',   url: 'https://youtube.com',   icon: 'bi-youtube' },
  { label: 'GitHub',    url: 'https://github.com',    icon: 'bi-github' },
  { label: 'Wikipedia', url: 'https://wikipedia.org', icon: 'bi-wikipedia' },
  { label: 'Twitch',    url: 'https://twitch.tv',     icon: 'bi-twitch' },
];

/* ── STATE ─────────────────────────────────────────────────────── */
let tabIdCounter = 0;
let tabs = [];
let activeTabId = null;
let settings = loadSettings();

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('auralis_demo_settings') || '{}');
    return {
      theme:        s.theme        || 'dark',
      searchEngine: s.searchEngine || 'google',
      lang:         s.lang         || 'fr',
      showFavBar:   s.showFavBar   !== undefined ? s.showFavBar : true,
      bookmarks:    s.bookmarks    || [],
    };
  } catch { return { theme: 'dark', searchEngine: 'google', lang: 'fr', showFavBar: true, bookmarks: [] }; }
}

function saveSettings() {
  localStorage.setItem('auralis_demo_settings', JSON.stringify(settings));
}

/* ── TAB MODEL ─────────────────────────────────────────────────── */
function createTab(url) {
  const id = ++tabIdCounter;
  const isNew = !url || url === 'newtab';
  tabs.push({ id, url: isNew ? 'newtab' : url, title: isNew ? (settings.lang === 'fr' ? 'Nouvel onglet' : 'New tab') : url, loading: false });
  return id;
}

function getTab(id) { return tabs.find(t => t.id === id); }
function getActive() { return getTab(activeTabId); }

/* ── DOM REFERENCES ─────────────────────────────────────────────── */
const tabStrip     = document.getElementById('tab-strip');
const btnNewTab    = document.getElementById('btn-new-tab');
const contentArea  = document.getElementById('content-area');
const urlBar       = document.getElementById('url-bar');
const urlSecurity  = document.getElementById('url-security');
const btnBack      = document.getElementById('btn-back');
const btnForward   = document.getElementById('btn-forward');
const btnReload    = document.getElementById('btn-reload');
const btnHome      = document.getElementById('btn-home');
const btnBookmark  = document.getElementById('btn-bookmark');
const btnToggleFav = document.getElementById('btn-toggle-fav');
const favBar       = document.getElementById('favorites-bar');
const settingsBtn  = document.getElementById('btn-settings');
const settingsOverlay = document.getElementById('settings-overlay');
const settingsClose   = document.getElementById('settings-close');

/* ── RENDER TABS ────────────────────────────────────────────────── */
function renderTabs() {
  Array.from(tabStrip.querySelectorAll('.tab')).forEach(el => el.remove());
  for (const tab of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
    el.dataset.tabId = tab.id;

    const icon = document.createElement('i');
    icon.className = tab.loading ? 'bi bi-arrow-clockwise tab-icon' : 'bi bi-globe tab-icon';
    if (tab.loading) icon.style.animation = 'spin 0.8s linear infinite';

    const title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = tab.title;
    title.title = tab.title;

    const closeBtn = document.createElement('button');
    closeBtn.className = 'tab-close';
    closeBtn.innerHTML = '<i class="bi bi-x"></i>';
    closeBtn.addEventListener('click', e => { e.stopPropagation(); closeTab(tab.id); });

    el.append(icon, title, closeBtn);
    el.addEventListener('click', () => activateTab(tab.id));
    tabStrip.insertBefore(el, btnNewTab);
  }
}

/* ── RENDER CONTENT ─────────────────────────────────────────────── */
function renderContent() {
  // Clean up old elements
  Array.from(contentArea.querySelectorAll('.tab-frame, .newtab-page')).forEach(el => el.remove());

  for (const tab of tabs) {
    if (tab.url === 'newtab') {
      const page = buildNewTabPage(tab.id);
      page.classList.toggle('active', tab.id === activeTabId);
      contentArea.appendChild(page);
    } else {
      const frame = document.createElement('iframe');
      frame.className = 'tab-frame' + (tab.id === activeTabId ? ' active' : '');
      frame.dataset.tabId = tab.id;
      frame.src = tab.url;
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation-by-user-activation');

      frame.addEventListener('load', () => {
        const t = getTab(tab.id);
        if (!t) return;
        t.loading = false;
        // Try to read title (same-origin only)
        try {
          const docTitle = frame.contentDocument?.title;
          if (docTitle) t.title = docTitle;
        } catch {}
        if (!getTab(tab.id)?.title || getTab(tab.id).title === tab.url) {
          try { t.title = new URL(tab.url).hostname || tab.url; } catch {}
        }
        if (tab.id === activeTabId) updateNavbar();
        renderTabs();
      });

      contentArea.appendChild(frame);
    }
  }
}

function buildNewTabPage(tabId) {
  const page = document.createElement('div');
  page.className = 'newtab-page';
  page.dataset.tabId = tabId;

  const logoSvg = `<svg width="56" height="56" viewBox="0 0 32 32" fill="none">
    <defs><linearGradient id="ng${tabId}" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8587a"/><stop offset="100%" stop-color="#9b6fe0"/>
    </linearGradient></defs>
    <rect width="32" height="32" rx="8" fill="rgba(155,111,224,.15)"/>
    <path d="M16 5L24 27H8L16 5z" stroke="url(#ng${tabId})" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
    <path d="M10.5 20h11" stroke="url(#ng${tabId})" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;

  const logoDiv = document.createElement('div');
  logoDiv.className = 'newtab-logo';
  logoDiv.innerHTML = logoSvg + '<span class="newtab-logo-name">Auralis</span>';

  const timeEl = document.createElement('div');
  timeEl.className = 'newtab-time';
  timeEl.textContent = currentTime();
  const interval = setInterval(() => {
    if (!document.body.contains(timeEl)) { clearInterval(interval); return; }
    timeEl.textContent = currentTime();
  }, 1000);

  const dateEl = document.createElement('div');
  dateEl.className = 'newtab-date';
  dateEl.textContent = currentDate();

  const searchWrap = document.createElement('div');
  searchWrap.className = 'newtab-search';
  searchWrap.innerHTML = '<i class="bi bi-search"></i>';
  const searchInput = document.createElement('input');
  searchInput.type = 'text';
  searchInput.placeholder = settings.lang === 'fr' ? 'Rechercher sur le web…' : 'Search the web…';
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && searchInput.value.trim()) {
      navigate(activeTabId, resolveInput(searchInput.value.trim()));
    }
  });
  searchWrap.appendChild(searchInput);

  const quickLinks = document.createElement('div');
  quickLinks.className = 'newtab-quicklinks';
  for (const link of QUICK_LINKS) {
    const a = document.createElement('a');
    a.className = 'quicklink';
    a.href = '#';
    a.innerHTML = `<i class="bi ${link.icon}"></i><span>${link.label}</span>`;
    a.addEventListener('click', e => { e.preventDefault(); navigate(activeTabId, link.url); });
    quickLinks.appendChild(a);
  }

  page.append(logoDiv, timeEl, dateEl, searchWrap, quickLinks);
  return page;
}

function currentTime() {
  const now = new Date();
  return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function currentDate() {
  return new Date().toLocaleDateString(settings.lang === 'fr' ? 'fr-FR' : 'en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

/* ── NAVIGATION ─────────────────────────────────────────────────── */
function resolveInput(input) {
  if (!input) return 'newtab';
  if (input === 'newtab') return 'newtab';
  try {
    const u = new URL(input.includes('://') ? input : 'https://' + input);
    if (u.hostname.includes('.') || input.startsWith('localhost')) {
      return input.includes('://') ? input : 'https://' + input;
    }
  } catch {}
  return SEARCH_ENGINES[settings.searchEngine](input);
}

function navigate(tabId, url) {
  const tab = getTab(tabId);
  if (!tab) return;
  tab.url = url;
  tab.title = url === 'newtab' ? (settings.lang === 'fr' ? 'Nouvel onglet' : 'New tab') : (tryHostname(url) || url);
  tab.loading = url !== 'newtab';
  renderTabs();
  renderContent();
  if (tabId === activeTabId) updateNavbar();
}

function tryHostname(url) {
  try { return new URL(url).hostname; } catch { return url; }
}

/* ── TAB MANAGEMENT ─────────────────────────────────────────────── */
function openTab(url) {
  const id = createTab(url);
  activeTabId = id;
  renderTabs();
  renderContent();
  updateNavbar();
}

function activateTab(id) {
  activeTabId = id;
  // Switch active class on frames/newtab pages
  Array.from(contentArea.children).forEach(el => {
    el.classList.toggle('active', el.dataset.tabId == id);
  });
  renderTabs();
  updateNavbar();
}

function closeTab(id) {
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  tabs.splice(idx, 1);
  if (tabs.length === 0) { openTab('newtab'); return; }
  if (activeTabId === id) {
    activeTabId = tabs[Math.min(idx, tabs.length - 1)].id;
  }
  renderTabs();
  renderContent();
  updateNavbar();
}

/* ── NAVBAR UPDATE ─────────────────────────────────────────────── */
function updateNavbar() {
  const tab = getActive();
  if (!tab) return;

  const url = tab.url;
  if (url === 'newtab') {
    urlBar.value = '';
    urlSecurity.innerHTML = '<i class="bi bi-house"></i>';
    urlSecurity.className = 'url-security';
  } else {
    urlBar.value = url;
    try {
      const u = new URL(url);
      if (u.protocol === 'https:') {
        urlSecurity.innerHTML = '<i class="bi bi-lock-fill"></i>';
        urlSecurity.className = 'url-security secure';
      } else {
        urlSecurity.innerHTML = '<i class="bi bi-exclamation-triangle"></i>';
        urlSecurity.className = 'url-security';
      }
    } catch {
      urlSecurity.innerHTML = '<i class="bi bi-globe2"></i>';
      urlSecurity.className = 'url-security';
    }
  }

  // Bookmark icon
  const isBookmarked = settings.bookmarks.some(b => b.url === url);
  btnBookmark.innerHTML = isBookmarked ? '<i class="bi bi-bookmark-fill" style="color:var(--violet)"></i>' : '<i class="bi bi-bookmark"></i>';
}

/* ── FAVORITES BAR ─────────────────────────────────────────────── */
function renderFavBar() {
  favBar.innerHTML = '';
  favBar.classList.toggle('hidden', !settings.showFavBar);
  if (!settings.showFavBar) return;

  if (settings.bookmarks.length === 0) {
    const hint = document.createElement('span');
    hint.style.cssText = 'font-size:11px;color:var(--text-3);padding:0 8px';
    hint.textContent = settings.lang === 'fr' ? 'Vos favoris apparaissent ici.' : 'Your bookmarks appear here.';
    favBar.appendChild(hint);
    return;
  }

  for (const bm of settings.bookmarks.slice(0, 12)) {
    const btn = document.createElement('button');
    btn.className = 'fav-item';
    btn.title = bm.title || bm.url;
    btn.innerHTML = `<i class="bi bi-globe fav-icon"></i>${escHtml(bm.title || tryHostname(bm.url))}`;
    btn.addEventListener('click', () => navigate(activeTabId, bm.url));
    favBar.appendChild(btn);
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── BOOKMARK TOGGLE ────────────────────────────────────────────── */
btnBookmark.addEventListener('click', () => {
  const tab = getActive();
  if (!tab || tab.url === 'newtab') return;
  const idx = settings.bookmarks.findIndex(b => b.url === tab.url);
  if (idx !== -1) {
    settings.bookmarks.splice(idx, 1);
  } else {
    settings.bookmarks.push({ id: Date.now(), url: tab.url, title: tab.title, createdAt: Date.now() });
  }
  saveSettings();
  updateNavbar();
  renderFavBar();
});

btnToggleFav.addEventListener('click', () => {
  settings.showFavBar = !settings.showFavBar;
  saveSettings();
  renderFavBar();
  document.getElementById('toggle-favbar').checked = settings.showFavBar;
});

/* ── URL BAR ─────────────────────────────────────────────────────── */
urlBar.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    navigate(activeTabId, resolveInput(urlBar.value.trim()));
    urlBar.blur();
  } else if (e.key === 'Escape') {
    updateNavbar();
    urlBar.blur();
  }
});
urlBar.addEventListener('focus', () => urlBar.select());

/* ── NAV BUTTONS ─────────────────────────────────────────────────── */
btnBack.addEventListener('click', () => {
  const frame = activeFrame();
  if (frame) try { frame.contentWindow.history.back(); } catch {}
});
btnForward.addEventListener('click', () => {
  const frame = activeFrame();
  if (frame) try { frame.contentWindow.history.forward(); } catch {}
});
btnReload.addEventListener('click', () => {
  const tab = getActive();
  if (!tab) return;
  if (tab.url === 'newtab') { renderContent(); return; }
  const frame = activeFrame();
  if (frame) try { frame.contentWindow.location.reload(); } catch { navigate(activeTabId, tab.url); }
});
btnHome.addEventListener('click', () => navigate(activeTabId, 'newtab'));

function activeFrame() {
  return contentArea.querySelector(`.tab-frame[data-tab-id="${activeTabId}"]`);
}

/* ── NEW TAB / CLOSE ─────────────────────────────────────────────── */
btnNewTab.addEventListener('click', () => openTab('newtab'));

document.getElementById('btn-close-demo').addEventListener('click', () => {
  window.location.href = '../index.html';
});

/* ── SETTINGS ───────────────────────────────────────────────────── */
settingsBtn.addEventListener('click', () => {
  settingsOverlay.classList.add('open');
  syncSettingsUI();
});
settingsClose.addEventListener('click', () => settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    settings.theme = btn.dataset.theme;
    saveSettings();
    applyTheme();
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === settings.theme));
  });
});

document.getElementById('toggle-favbar').addEventListener('change', e => {
  settings.showFavBar = e.target.checked;
  saveSettings();
  renderFavBar();
});

document.getElementById('search-engine-select').addEventListener('change', e => {
  settings.searchEngine = e.target.value;
  saveSettings();
});

document.getElementById('lang-select').addEventListener('change', e => {
  settings.lang = e.target.value;
  saveSettings();
});

function syncSettingsUI() {
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === settings.theme));
  document.getElementById('toggle-favbar').checked = settings.showFavBar;
  document.getElementById('search-engine-select').value = settings.searchEngine;
  document.getElementById('lang-select').value = settings.lang;
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', settings.theme);
}

/* ── DEMO NOTICE ─────────────────────────────────────────────────── */
document.getElementById('demo-notice-close').addEventListener('click', () => {
  document.getElementById('demo-notice').style.display = 'none';
  document.getElementById('browser').style.height = '100vh';
});

/* ── KEYBOARD SHORTCUTS ──────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 't') { e.preventDefault(); openTab('newtab'); }
  if (mod && e.key === 'w') { e.preventDefault(); closeTab(activeTabId); }
  if (mod && e.key === 'l') { e.preventDefault(); urlBar.focus(); urlBar.select(); }
  if (mod && e.key === 'r') { e.preventDefault(); btnReload.click(); }
  if (mod && e.shiftKey && e.key === 'P') { e.preventDefault(); settingsOverlay.classList.toggle('open'); if (settingsOverlay.classList.contains('open')) syncSettingsUI(); }
});

/* ── INIT ───────────────────────────────────────────────────────── */
applyTheme();
openTab('newtab');
renderFavBar();
syncSettingsUI();
</script>
</body>
</html>
